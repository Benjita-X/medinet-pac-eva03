# Frontend PAC: archivos estáticos con cabeceras de seguridad estrictas.
# Corre como usuario sin privilegios (101) en el puerto 8080, con el sistema de archivos de solo lectura.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # El HTML y el JS solo pueden cargar recursos del mismo origen; las llamadas a la API
    # van a /patients en el mismo dominio (el ALB las enruta al backend).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control "no-cache" always;

    # Health check del ALB
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri /index.html;
    }

    # Nada de listados de directorio ni archivos ocultos
    autoindex off;
    location ~ /\. { deny all; }
}
