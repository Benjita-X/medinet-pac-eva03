# SOLO PARA PROBAR EN LOCAL: imita las reglas del ALB de AWS.
# /patients, /docs, /openapi.json y /health -> API (puerto 8000); todo lo demás -> frontend (8080).
server {
    listen 8080;
    location /patients     { proxy_pass http://pacapi:8000; proxy_set_header X-Amzn-Trace-Id $request_id; }
    location /docs         { proxy_pass http://pacapi:8000; }
    location = /openapi.json { proxy_pass http://pacapi:8000; }
    location = /health     { proxy_pass http://pacapi:8000; }
    location /             { proxy_pass http://pacfront:8080; }
}
